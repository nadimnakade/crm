<!-- Global centered blocking loading overlay -->
<div class="loading-backdrop" *ngIf="loading$ | async" aria-hidden="true">
  <div class="loading-modal" role="dialog" aria-label="Loading">
    <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
    <div>
      <strong>Loading</strong>
      <div class="text-muted" style="font-size: 0.9rem;">Please wait…</div>
    </div>
  </div>
</div>

<router-outlet />
