<div class="role-list-container">
  <div class="header">
    <h2>Role Management</h2>
    <button class="btn-add" routerLink="/roles/new">Add Role</button>
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Search roles..." [(ngModel)]="searchTerm" (input)="filterRoles()">
  </div>

  <table class="roles-table" *ngIf="filteredRoles.length > 0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Permissions</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of filteredRoles">
        <td>{{ role.name }}</td>
        <td>{{ role.description }}</td>
        <td>{{ role.permissions?.length || 0 }} permissions</td>
        <td class="actions">
          <button class="btn-view" [routerLink]="['/roles', role.id]">View</button>
          <button class="btn-edit" [routerLink]="['/roles', role.id, 'edit']">Edit</button>
          <button class="btn-delete" (click)="deleteRole(role.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="no-roles" *ngIf="filteredRoles.length === 0">
    No roles found. Try adjusting your search or add a new role.
  </div>
</div>
