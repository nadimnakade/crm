<div class="card glass-card h-100 shadow-sm w-75" style="margin:0 auto">

  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Customer Details</h5><span _ngcontent-ng-c1507357036="" class="text-color small"><button
        class="btn btn-primary" routerLink="/customers/new">Add Customer</button></span>
  </div>





  <div class="card-body ">
    <table class="table table-bordered table-hover align  -items-center mb-0 p-6 w-75" style="margin:0 auto">
      <thead>
        <tr>
         
          <td>
             <label class="ms-2">Status:</label>
              <select [(ngModel)]="statusFilter" (change)="onStatusChange()">
                <option value="">All</option>
                <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
              </select>   
            <label class="ms-2">Page size:</label>
              <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
                <option [value]="10">10</option>
                <option [value]="25">25</option>
                <option [value]="50">50</option>
                <option [value]="100">100</option>
              </select>
          </td>
           <td colspan="2">
            <div class="search-bar float-end">
              <input type="text" placeholder="Enter 10-digit mobile number" inputmode="numeric" maxlength="10" [(ngModel)]="searchTerm" (input)="filterCustomers(true)">
              
            </div>
          </td>
        </tr>
      </thead>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th style="width:20%">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="filteredCustomers.length === 0">
          <td colspan="3" class="no-data">Enter a valid 10-digit mobile number to search</td>
        </tr>
        <tr *ngFor="let customer of filteredCustomers">
          <td [innerHTML]="highlight((customer.firstName || '') + ' ' + (customer.lastName || ''))"></td>
          <td [innerHTML]="highlight(customer.phone)"></td>
          <td class="actions">
            <a [routerLink]="['/customers', customer.id]" class="text-primary me-3" title="View">
              <i class="fa-solid fa-eye"></i>
            </a>
            <a [routerLink]="['/customers', customer.id, 'edit']" class="text-success me-3" title="Edit">
              <i class="fa-solid fa-pen-to-square"></i>
            </a>
            <a [routerLink]="['/customers', customer.id, 'history']" class="text-info me-3" title="History">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </a>
            <button class="btn btn-link text-danger p-0" (click)="deleteCustomer(customer.id)" title="Delete">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-bar d-flex float-end gap-2 mb-4 align-items-center" *ngIf="filteredCustomers.length > 0">
    <span class="mx-2 small">Showing {{ ((page - 1) * pageSize) + (filteredCustomers.length ? 1 : 0) }}–{{ ((page - 1) * pageSize) + filteredCustomers.length }} of {{ total }}</span>
    <button class="btn btn-outline-secondary btn-sm" (click)="prevPage()" [disabled]="page <= 1">Prev</button>
    <span class="page-info small">Page {{ page }}</span>
    <button class="btn btn-outline-secondary btn-sm" (click)="nextPage()" [disabled]="!hasMore">Next</button>
  </div>
</div>
