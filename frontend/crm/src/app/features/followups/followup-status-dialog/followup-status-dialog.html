
<div class="modal-backdrop fade show"></div>
<div class="modal fade show" style="display: block;" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update Follow-up Status</h5>
        <button type="button" class="close" aria-label="Close" (click)="onCancel()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Status <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="status">
            <option value="">Select Status</option>
            <option *ngFor="let opt of statusOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Reason <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="reason" placeholder="Enter reason">
        </div>

        <div class="form-group">
          <label>Comments / Remarks</label>
          <textarea class="form-control" [(ngModel)]="notes" rows="3" placeholder="Add comments"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onSave()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
