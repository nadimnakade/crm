<div class="card glass-card h-100 shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Follow-up Status History</h5>
    <div>
      <button class="btn btn-sm btn-outline-secondary me-2" (click)="load()" [disabled]="loading">
        Refresh
      </button>
    </div>
  </div>

  <div class="card-body">
    <div class="mb-3 row">
      <label class="col-sm-2 col-form-label">From</label>
      <div class="col-sm-4">
        <input type="date" class="form-control" [(ngModel)]="fromDate" (change)="load()" [disabled]="loading">
      </div>
      <label class="col-sm-2 col-form-label">To</label>
      <div class="col-sm-4">
        <input type="date" class="form-control" [(ngModel)]="toDate" (change)="load()" [disabled]="loading">
      </div>
    </div>
    <div class="mb-2">
      <button class="btn btn-sm btn-outline-secondary me-2" (click)="setRange(1)" [disabled]="loading">Today</button>
      <button class="btn btn-sm btn-outline-secondary me-2" (click)="setRange(7)" [disabled]="loading">Last 7 days</button>
      <button class="btn btn-sm btn-outline-secondary" (click)="setRange(30)" [disabled]="loading">Last 30 days</button>
    </div>

    <div *ngIf="error" class="alert alert-danger mt-2">{{ error }}</div>

    <div class="table-responsive mt-2" *ngIf="!loading && !error">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Changed At</th>
            <th>Agent</th>
            <th>Changed By</th>
            <th>Status</th>
            <th>Order Id</th>
            <th>Customer</th>
            <th>Phone</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of data">
            <td>{{ r.ChangedAt }}</td>
            <td>{{ r.AgentName }}</td>
            <td>{{ r.ChangedBy }}</td>
            <td>{{ r.PreviousStatus }} → {{ r.NewStatus }}</td>
            <td>{{ r.OrderId || '-' }}</td>
            <td>{{ r.CustomerName }}</td>
            <td>{{ r.CustomerMobileNo }}</td>
          </tr>
          <tr *ngIf="data.length === 0">
            <td colspan="7" class="text-center text-muted">No status updates in this period.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
