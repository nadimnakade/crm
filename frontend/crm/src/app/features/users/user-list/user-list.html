<div class="user-list-container">
  <div class="header">
    <h2>User Management</h2>
    <button class="btn-add" routerLink="/users/new">Add User</button>
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Search users..." [(ngModel)]="searchTerm" (input)="filterUsers()">
  </div>

  <table class="users-table" *ngIf="filteredUsers.length > 0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.active ? 'Active' : 'Inactive' }}</td>
        <td class="actions">
          <button class="btn-view" [routerLink]="['/users', user.id]">View</button>
          <button class="btn-edit" [routerLink]="['/users', user.id, 'edit']">Edit</button>
          <button class="btn-delete" (click)="deleteUser(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="no-users" *ngIf="filteredUsers.length === 0">
    No users found. Try adjusting your search or add a new user.
  </div>
</div>
