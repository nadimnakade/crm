<div class="dashboard-container" [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme"
  [class.sidebar-collapsed]="isSidebarCollapsed">
  <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar" title="Toggle sidebar">
    <svg viewBox="0 0 24 24" class="toggle-icon">
      <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"></path>
    </svg>
  </button>
  <aside class="sidebar ">

    <nav class="nav-menu mt-4">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <i class="fa-solid fa-house nav-icon"></i>
        <span class="nav-label">Dashboard</span>
      </a>
      <!-- <a *ngIf="!isOrdersOnlyRole" routerLink="/calls" routerLinkActive="active" class="nav-item">
        <i class="fa-solid fa-phone nav-icon"></i>
        <span class="nav-label">Calls</span>
      </a> -->
      <!-- Customers group -->
      <div *ngIf="!isOrdersOnlyRole" class="nav-item-row" (click)="toggleCustomers()">
        <div class="left">
          <i class="fa-solid fa-users nav-icon"></i>
          <span class="label">Customers</span>
        </div>
        <i class="fa-solid fa-chevron-down chevron" [style.transform]="customersOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></i>
      </div>
      <div class="nav-submenu" *ngIf="!isOrdersOnlyRole && customersOpen">
        <a routerLink="/customers" routerLinkActive="active" class="submenu-item" title="Customer List">
          <i class="fa-solid fa-table nav-icon"></i>
          <span class="label">Customer List</span>
        </a>
        <a routerLink="/portfolio" routerLinkActive="active" class="submenu-item" title="Customer Portfolio">
          <i class="fa-solid fa-folder-open nav-icon"></i>
          <span class="label">Portfolio</span>
        </a>
        <a routerLink="/customer-medicine-detail" routerLinkActive="active" class="submenu-item" title="Medicine Detail">
          <i class="fa-solid fa-pills nav-icon"></i>
          <span class="label">Medicine Detail</span>
        </a>
      </div>
      <!-- Reports group -->
      <div class="nav-item-row" (click)="toggleReports()">
        <div class="left">
          <i class="fa-solid fa-chart-line nav-icon"></i>
          <span class="label">Reports</span>
        </div>
        <i class="fa-solid fa-chevron-down chevron" [style.transform]="reportsOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></i>
      </div>
      <div class="nav-submenu" *ngIf="reportsOpen">
        <a routerLink="/orders/recent" routerLinkActive="active" class="submenu-item" title="Recent Orders">
          <i class="fa-solid fa-clock nav-icon"></i>
          <span class="label">Recent</span>
        </a>
        <a *ngIf="canManageUsersAndRoles || isOrdersOnlyRole"
           routerLink="/reports"
           routerLinkActive="active"
           class="submenu-item"
           title="All Reports">
          <i class="fa-solid fa-file-export nav-icon"></i>
          <span class="label">All Reports</span>
        </a>
      </div>
      <!-- Orders group -->
      <div class="nav-item-row" (click)="toggleOrders()">
        <div class="left">
          <i class="fa-solid fa-boxes-stacked nav-icon"></i>
          <span class="label">Orders</span>
        </div>
        <i class="fa-solid fa-chevron-down chevron" [style.transform]="ordersOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></i>
      </div>
      <div class="nav-submenu" *ngIf="ordersOpen">
        <!-- <a *ngIf="!isOrdersOnlyRole" routerLink="/orders/uploaded" routerLinkActive="active" class="submenu-item" title="Order List">
          <i class="fa-solid fa-table-list nav-icon"></i>
          <span class="label">Order List</span>
        </a> -->
        <a  routerLink="/orders/reorder-list" routerLinkActive="active" class="submenu-item" title="Re-orders">
          <i class="fa-solid fa-repeat nav-icon"></i>
          <span class="label">Re-orders</span>
        </a>
      </div>
      <!-- Uploads group (admin only) -->
      <div *ngIf="canUpload" class="nav-item-row" (click)="toggleUploads()">
        <div class="left">
          <i class="fa-solid fa-file-arrow-up nav-icon"></i>
          <span class="label">Uploads</span>
        </div>
        <i class="fa-solid fa-chevron-down chevron" [style.transform]="uploadsOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></i>
      </div>
      <div class="nav-submenu" *ngIf="canUpload && uploadsOpen">
        <a routerLink="/orders/upload" routerLinkActive="active" class="submenu-item" title="Upload Orders">
          <i class="fa-solid fa-file-circle-plus nav-icon"></i>
          <span class="label">Upload Orders</span>
        </a>
        <a routerLink="/followups/upload" routerLinkActive="active" class="submenu-item" title="Upload Follow-ups">
          <i class="fa-solid fa-file-circle-plus nav-icon"></i>
          <span class="label">Upload Follow-ups</span>
        </a>
      </div>
      <!-- Search group -->
      <div class="nav-item-row" (click)="toggleSearch()">
        <div class="left">
          <i class="fa-solid fa-magnifying-glass nav-icon"></i>
          <span class="label">Search</span>
        </div>
        <i class="fa-solid fa-chevron-down chevron" [style.transform]="searchOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></i>
      </div>
      <div class="nav-submenu" *ngIf="searchOpen">
        <a routerLink="/search/orders" routerLinkActive="active" class="submenu-item" title="Orders Search">
          <i class="fa-solid fa-magnifying-glass nav-icon"></i>
          <span class="label">Orders</span> 
        </a>
        <a routerLink="/search/refunds" routerLinkActive="active" class="submenu-item" title="Refunds Search">
          <i class="fa-solid fa-rotate-left nav-icon"></i>
          <span class="label">Refunds</span>
        </a>
      </div>

      <!-- Follow-ups group -->
      <div class="nav-item-row" (click)="toggleFollowups()">
        <div class="left">
          <i class="fa-solid fa-list-check nav-icon"></i>
          <span class="label">Follow-ups</span>
        </div>
        <i class="fa-solid fa-chevron-down chevron" [style.transform]="followupsOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></i>
      </div>
      <div class="nav-submenu" *ngIf="followupsOpen">
        <!-- <a routerLink="/followups" routerLinkActive="active" class="submenu-item">
          <i class="fa-solid fa-list-check nav-icon"></i>
          <span class="label">List</span>
        </a> -->
        <a routerLink="/followups/today" routerLinkActive="active" class="submenu-item">
          <i class="fa-solid fa-calendar-day nav-icon"></i>
          <span class="label">Followup by Agents</span>
        </a>
        <a routerLink="/followups/uploaded" routerLinkActive="active" class="submenu-item">
          <i class="fa-solid fa-file-lines nav-icon"></i>
          <span class="label">Todays Followup</span>
        </a>
        <a routerLink="/followups/history" routerLinkActive="active" class="submenu-item">
          <i class="fa-solid fa-clock-rotate-left nav-icon"></i>
          <span class="label">Followup History</span>
        </a>
        <a routerLink="/followups/reorder-history" routerLinkActive="active" class="submenu-item">
          <i class="fa-solid fa-clock-rotate-left nav-icon"></i>
          <span class="label">Reorder History</span>
        </a>
        <!-- <a routerLink="/reports/followups" routerLinkActive="active" class="submenu-item">
          <i class="fa-solid fa-calendar-check nav-icon"></i>
          <span class="label">Report</span>
        </a> -->
      </div>
      
      <!-- Remove duplicate standalone items to keep groups consistent -->
      <!-- Standalone items summarized above in groups; keep Users and Profile below -->
      <a *ngIf="canManageUsersAndRoles" routerLink="/users" routerLinkActive="active" class="nav-item">
        <i class="fa-solid fa-table-list nav-icon"></i>
        <span class="nav-label">Users</span>
      </a>
      <a *ngIf="canManageUsersAndRoles" routerLink="/roles" routerLinkActive="active" class="d-none nav-item">
        <i class="fa-solid fa-gear nav-icon"></i>
        <span class="nav-label">Roles</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item profile">
        <i class="fa-solid fa-user nav-icon"></i>
        <span class="nav-label">Profile</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="dashboard-header">
      <!-- <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
        <input type="text" placeholder="Search here...">
      </div> -->
      <div class="logo">
        <img src="https://ishealthy.in/images/Is-logo.png" alt="IsHealthy" class="logo-img" />
      </div>
      <div>
        <h1 class="dashboard-title text-center">CRM</h1>
      </div>
      <div class="user-profile">
        <button class="theme-switch" (click)="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
          <span class="switch-track"></span>
          <span class="switch-thumb"></span>
          <svg class="icon-sun" viewBox="0 0 24 24">
            <path
              d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.8 1.42-1.42zM1 13h3v-2H1v2zm10-9h-2v3h2V4zm7.45 1.46l-1.41-1.41-1.8 1.79 1.42 1.42 1.79-1.8zM17 11a5 5 0 1 1-10 0 5 5 0 0 1 10 0zm4 2v-2h-3v2h3zM4.24 19.76l1.41 1.41 1.8-1.79-1.42-1.42-1.79 1.8zM13 20h-2v3h2v-3zm5.66-1.54l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4z">
            </path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 0 0 0 18c4.97 0 9-4.03 9-9 0-1.02-.18-2-.5-2.92A7 7 0 0 1 12 3z"></path>
          </svg>
        </button>
        <span class="user-email">{{ userName }}</span>
      <div class="avatar">
        <img src="https://avatar.iran.liara.run/public/49" alt="User avatar">
      </div>
      <button class="logout-btn" (click)="logout()" aria-label="Logout" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

    <div class="content-slot">
      <router-outlet />
    </div>
  </main>
</div>
