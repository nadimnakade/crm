<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="registerData.username" 
          required
          class="form-control">
      </div>

      <div class="form-group form-grid">
        <div>
          <label for="firstName">First Name</label>
          <input 
            type="text" 
            id="firstName" 
            name="firstName" 
            [(ngModel)]="registerData.firstName" 
            required
            class="form-control">
        </div>
        <div>
          <label for="lastName">Last Name</label>
          <input 
            type="text" 
            id="lastName" 
            name="lastName" 
            [(ngModel)]="registerData.lastName" 
            required
            class="form-control">
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="registerData.email" 
          required 
          email
          class="form-control">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="registerData.password"
          required minlength="6"
          class="form-control">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required minlength="6"
          class="form-control">
        <div class="validation-message" *ngIf="registerData.password && confirmPassword && registerData.password !== confirmPassword">
          Passwords do not match.
        </div>
      </div>
      
      <div class="form-actions">
        <button type="submit" [disabled]="!registerForm.valid || registerData.password !== confirmPassword" class="btn-primary">Register</button>
      </div>
      
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>
    </form>
    
    <div class="login-link">
      <p>Already have an account? <a routerLink="/login">Login</a></p>
    </div>
  </div>
</div>
